<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Diarium — přihlášení</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0f0f23; color:#a5b4fc; font-family:system-ui,sans-serif; padding:1.5rem; }
  .card { max-width:24rem; text-align:center; }
  h1 { color:#818cf8; font-size:1.15rem; margin:0 0 .75rem; }
  p { margin:0; font-size:.9rem; line-height:1.5; }
  a { color:#a5b4fc; }
</style>
</head>
<body>
<main class="card">
  <h1>Diarium</h1>
  <p id="status" role="status">Dokončuji přihlášení…</p>
</main>

<script>
(function () {
  "use strict";

  var statusEl = document.getElementById("status");

  function fail(message) {
    statusEl.textContent = message;
    var link = document.createElement("a");
    link.href = "/";
    link.textContent = " Zpět na přihlášení";
    statusEl.appendChild(link);
  }

  function decodePayload(token) {
    try {
      var part = token.split(".")[1];
      if (!part) return null;
      var normalized = part.replace(/-/g, "+").replace(/_/g, "/");
      while (normalized.length % 4) normalized += "=";
      return JSON.parse(atob(normalized));
    } catch (e) {
      return null;
    }
  }

  // The project ref is never hardcoded: prefer the token issuer, then an
  // existing Supabase session key, so previews/custom domains keep working.
  function projectRefFromToken(token) {
    var payload = decodePayload(token);
    var issuer = payload && typeof payload.iss === "string" ? payload.iss : "";
    var match = issuer.match(/^https:\/\/([a-z0-9-]+)\.supabase\.co(?:\/|$)/i);
    return match ? match[1] : null;
  }

  function projectRefFromStorage() {
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i) || "";
        var match = key.match(/^sb-([a-z0-9-]+)-auth-token$/i);
        if (match) return match[1];
      }
    } catch (e) {}
    return null;
  }

  function storeImplicitSession(accessToken, hashParams) {
    var payload = decodePayload(accessToken);
    if (!payload) return false;

    var ref = projectRefFromToken(accessToken) || projectRefFromStorage();
    if (!ref) return false;

    var expiresAt = parseInt(hashParams.get("expires_at") || "0", 10);
    if (!expiresAt && payload.exp) expiresAt = payload.exp;
    if (!expiresAt) expiresAt = Math.floor(Date.now() / 1000) + 3600;

    var session = {
      access_token: accessToken,
      refresh_token: hashParams.get("refresh_token") || "",
      expires_at: expiresAt,
      token_type: hashParams.get("token_type") || "bearer",
      user: {
        id: payload.sub,
        email: payload.email,
        user_metadata: payload.user_metadata || {},
        app_metadata: payload.app_metadata || {},
        aud: payload.aud || "authenticated",
        role: payload.role || "authenticated"
      }
    };

    try {
      localStorage.setItem("sb-" + ref + "-auth-token", JSON.stringify(session));
      return true;
    } catch (e) {
      return false;
    }
  }

  try {
    var hash = window.location.hash.replace(/^#/, "");
    if (hash) {
      var hashParams = new URLSearchParams(hash);
      var accessToken = hashParams.get("access_token");
      if (accessToken) {
        if (storeImplicitSession(accessToken, hashParams)) {
          window.location.replace("/");
          return;
        }
        // Unknown project ref: let the app callback resolve it from env.
        window.location.replace("/auth/callback" + window.location.search + window.location.hash);
        return;
      }
    }

    var params = new URLSearchParams(window.location.search);
    if (params.get("code")) {
      // PKCE: hand the one-time code to the app route that owns the anon key
      // and code verifier. Never print it or any session data to the DOM.
      window.location.replace("/auth/callback" + window.location.search);
      return;
    }

    if (params.get("error")) {
      fail("Přihlášení se nepodařilo. Zkus to prosím znovu.");
      return;
    }

    fail("Chybí přihlašovací údaje.");
  } catch (e) {
    fail("Přihlášení se nepodařilo. Zkus to prosím znovu.");
  }
})();
</script>
</body>
</html>
